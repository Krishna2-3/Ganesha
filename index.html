<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shri Ganesh Aarti Book</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #fff8df, #f5d58a 45%, #c77824);
    font-family: Georgia, "Times New Roman", serif;
    color: #4b2107;
}

/* HEADER */

.header {
    text-align: center;
    padding: 25px 15px 15px;
}

.ganesh-symbol {
    font-size: 55px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

.header h1 {
    font-size: clamp(30px, 7vw, 52px);
    color: #8d2707;
    text-shadow: 2px 2px #ffd46a;
}

.header p {
    margin-top: 7px;
    font-size: 15px;
}


/* BOOK */

.book-container {
    width: min(94vw, 850px);
    margin: 10px auto 20px;
    perspective: 1800px;
}

.book {
    position: relative;
    min-height: 70vh;

    background:
        linear-gradient(
            90deg,
            rgba(100,50,10,.08),
            transparent 7%,
            transparent 93%,
            rgba(100,50,10,.08)
        ),
        #fffdf3;

    border-radius: 8px 18px 18px 8px;

    box-shadow:
        0 20px 45px rgba(60,25,0,.35),
        inset 8px 0 15px rgba(80,40,0,.08);

    overflow: hidden;
}


/* PAGE */

.page {
    min-height: 70vh;
    padding: 30px 25px;

    transform-origin: left center;

    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 30px,
            rgba(150,100,30,.035) 31px
        );
}

.page.turning {
    animation: turnPage .7s ease;
}

@keyframes turnPage {

    0% {
        transform: rotateY(0deg);
        opacity: 1;
    }

    45% {
        transform: rotateY(-75deg);
        opacity: .7;
    }

    100% {
        transform: rotateY(0deg);
        opacity: 1;
    }
}


/* TITLE */

.aarti-header {
    text-align: center;
    margin-bottom: 20px;
}

.aarti-header h2 {
    color: #8d2707;
    font-size: clamp(22px, 5vw, 34px);
}

.decorative-line {
    width: 180px;
    height: 3px;
    margin: 10px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d18a17,
            transparent
        );
}


/* AARTI TEXT */

.aarti-text {
    max-width: 700px;
    margin: auto;

    text-align: center;

    font-size: clamp(17px, 3.8vw, 22px);
    line-height: 1.9;

    white-space: pre-line;

    color: #4b2107;
}


/* CONTROLS */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;

    margin: 18px auto;
}

button {
    border: none;
    cursor: pointer;

    padding: 11px 20px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #9c2f08,
            #d47716
        );

    color: white;

    font-family: Georgia, serif;
    font-size: 15px;

    box-shadow:
        0 5px 12px rgba(80,30,0,.25);

    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(.96);
}

.counter {
    min-width: 80px;
    text-align: center;
}


/* THUMBNAILS */

.aarti-list {
    width: min(94vw, 850px);
    margin: auto;

    display: flex;
    gap: 8px;

    overflow-x: auto;

    padding: 8px 4px 20px;
}

.aarti-button {
    flex: 0 0 auto;

    padding: 9px 14px;

    border-radius: 20px;

    background: rgba(255,250,225,.85);

    border: 1px solid rgba(120,60,10,.2);

    color: #71350f;

    cursor: pointer;
}

.aarti-button.active {
    background: #9d3108;
    color: white;
}


/* FOOTER */

.footer {
    text-align: center;
    padding: 5px 20px 30px;

    color: #6d3b16;
    font-size: 14px;
}


/* UPDATE STATUS */

.update-status {
    position: fixed;

    bottom: 10px;
    right: 10px;

    padding: 6px 10px;

    background: rgba(70,30,0,.8);

    color: white;

    border-radius: 20px;

    font-family: Arial, sans-serif;

    font-size: 10px;

    opacity: .7;
}


/* MOBILE */

@media(max-width:600px) {

    .page {
        padding: 22px 15px;
        min-height: 65vh;
    }

    .book {
        min-height: 65vh;
    }

    .aarti-text {
        font-size: 18px;
        line-height: 1.8;
    }

}
</style>
</head>


<body>


<!-- ==========================
     HEADER
========================== -->

<header class="header">

    <div class="ganesh-symbol">
        🪔
    </div>

    <h1>
        श्री गणेश आरती
    </h1>

    <p>
        Shri Ganesh Aarti Sangrah
    </p>

</header>



<!-- ==========================
     DIGITAL BOOK
========================== -->

<div class="book-container">

    <div class="book">

        <div class="page" id="page">

            <div class="aarti-header">

                <h2 id="aartiTitle">
                    Shri Ganesh Aarti
                </h2>

                <div class="decorative-line"></div>

            </div>


            <div
                class="aarti-text"
                id="aartiText"
            >
                Loading Aarti...
            </div>

        </div>

    </div>

</div>



<!-- ==========================
     NAVIGATION
========================== -->

<div class="controls">

    <button onclick="previousAarti()">
        ← Previous
    </button>

    <div
        class="counter"
        id="counter"
    >
        1 / 10
    </div>

    <button onclick="nextAarti()">
        Next →
    </button>

</div>



<!-- ==========================
     AARTI SELECTOR
========================== -->

<div
    class="aarti-list"
    id="aartiList"
></div>



<div class="footer">
    श्री गणेशाय नमः
</div>


<div
    class="update-status"
    id="updateStatus"
>
    Checking...
</div>



<script>

/* =========================================================
   AARTI CONFIGURATION
=========================================================

   THIS IS THE ONLY SECTION YOU NEED TO MAINTAIN.

   Each Aarti has:

   1. Title
   2. Separate text file

   Example:

   aarti/
       aarti-1.txt
       aarti-2.txt
       aarti-3.txt
       ...
       aarti-10.txt

========================================================= */

const aartis = [

    {
        title: "Shri Ganesh Aarti",
        file: "aarti/aarti-1.txt"
    },

    {
        title: "Ganpati Bappa Aarti",
        file: "aarti/aarti-2.txt"
    },

    {
        title: "Sukhkarta Dukhharta",
        file: "aarti/aarti-3.txt"
    },

    {
        title: "Ganpati Atharvashirsha",
        file: "aarti/aarti-4.txt"
    },

    {
        title: "Jai Ganesh Deva",
        file: "aarti/aarti-5.txt"
    },

    {
        title: "Ganesh Vandana",
        file: "aarti/aarti-6.txt"
    },

    {
        title: "Ganesh Stotra",
        file: "aarti/aarti-7.txt"
    },

    {
        title: "Ganesh Mantra",
        file: "aarti/aarti-8.txt"
    },

    {
        title: "Ganesh Prarthana",
        file: "aarti/aarti-9.txt"
    },

    {
        title: "Ganesh Aarti",
        file: "aarti/aarti-10.txt"
    }

];


/* CURRENT AARTI */

let current = 0;


/*
   Cache version.

   This changes whenever the website checks
   for updated text files.
*/

let cacheVersion = Date.now();



/* =========================================================
   LOAD AARTI
========================================================= */

async function loadAarti(
    index,
    animate = true
) {

    if (index < 0) {
        index = aartis.length - 1;
    }

    if (index >= aartis.length) {
        index = 0;
    }

    current = index;


    const page =
        document.getElementById("page");


    if (animate) {

        page.classList.remove("turning");

        void page.offsetWidth;

        page.classList.add("turning");

    }


    document.getElementById(
        "aartiTitle"
    ).textContent =
        aartis[current].title;


    document.getElementById(
        "counter"
    ).textContent =
        `${current + 1} / ${aartis.length}`;


    const textElement =
        document.getElementById(
            "aartiText"
        );


    textElement.textContent =
        "Loading Aarti...";


    try {

        /*
           Cache-busting parameter.

           This makes the browser request the
           latest version of the text file.
        */

        const response =
            await fetch(
                aartis[current].file +
                "?v=" +
                cacheVersion,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            throw new Error(
                "Aarti file not found"
            );
        }


        const text =
            await response.text();


        textElement.textContent =
            text.trim();


    } catch (error) {

        textElement.textContent =
            "Unable to load this Aarti.";

        console.error(error);

    }


    updateButtons();

}



/* =========================================================
   NEXT
========================================================= */

function nextAarti() {

    loadAarti(
        current + 1,
        true
    );

}



/* =========================================================
   PREVIOUS
========================================================= */

function previousAarti() {

    loadAarti(
        current - 1,
        true
    );

}



/* =========================================================
   AARTI BUTTONS
========================================================= */

function createAartiButtons() {

    const container =
        document.getElementById(
            "aartiList"
        );


    container.innerHTML = "";


    aartis.forEach(
        (aarti, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "aarti-button";


            button.textContent =
                `${index + 1}. ${aarti.title}`;


            button.onclick = function() {

                loadAarti(
                    index,
                    true
                );

            };


            container.appendChild(
                button
            );

        }
    );


    updateButtons();

}



/* =========================================================
   ACTIVE BUTTON
========================================================= */

function updateButtons() {

    const buttons =
        document.querySelectorAll(
            ".aarti-button"
        );


    buttons.forEach(
        (button, index) => {

            button.classList.toggle(
                "active",
                index === current
            );

        }
    );

}



/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextAarti();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousAarti();

        }

    }
);



/* =========================================================
   SWIPE
========================================================= */

let touchStartX = 0;


document.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0]
                .screenX;

    }
);


document.addEventListener(
    "touchend",
    function(event) {

        const touchEndX =
            event.changedTouches[0]
                .screenX;


        const difference =
            touchEndX - touchStartX;


        if (
            Math.abs(difference) < 50
        ) {
            return;
        }


        if (difference < 0) {

            nextAarti();

        } else {

            previousAarti();

        }

    }
);



/* =========================================================
   LIVE UPDATE SYSTEM
=========================================================

   Checks every 30 seconds.

   If you replace:

       aarti/aarti-3.txt

   with a corrected version,

   the website will fetch the newest version.

   The visitor does NOT need to manually refresh.

========================================================= */

const UPDATE_INTERVAL =
    30000;


async function checkForUpdates() {

    cacheVersion =
        Date.now();


    /*
       Reload currently visible Aarti.
    */

    await loadAarti(
        current,
        false
    );


    document.getElementById(
        "updateStatus"
    ).textContent =
        "✓ Updated";


    setTimeout(
        function() {

            document.getElementById(
                "updateStatus"
            ).textContent =
                "Live";

        },
        2000
    );

}



/* =========================================================
   START
========================================================= */

createAartiButtons();

loadAarti(
    0,
    false
);


/*
   Check every 30 seconds.
*/

setInterval(
    checkForUpdates,
    UPDATE_INTERVAL
);

</script>

</body>
</html>
